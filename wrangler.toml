name = "vithai"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static front-end in /public; /api/* goes to the Worker first
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "vithai"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # printed by: npx wrangler d1 create vithai
migrations_dir = "migrations"

[vars]
# Lower this (e.g. 50000) only if sign-in hits Workers' free-plan CPU limit
PBKDF2_ITERATIONS = "100000"

# Secret (set with: npx wrangler secret put INGEST_TOKEN) — shared with the GitHub Action
