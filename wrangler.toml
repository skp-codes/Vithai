name = "vithai"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static front-end in /public; /api/* goes to the Worker first
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "vithai"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # printed by: npx wrangler d1 create vithai
migrations_dir = "migrations"

# Stores the Tickertape datasets (create with: npx wrangler kv namespace create DATA)
[[kv_namespaces]]
binding = "DATA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Lower this (e.g. 50000) only if sign-in hits Workers' free-plan CPU limit
PBKDF2_ITERATIONS = "100000"
# The site admin approves every new household. Their email is a secret (not published here):
#   npx wrangler secret put SITE_ADMIN_EMAIL
SITE_ADMIN_USERNAME = "skp1980"

# Secret (set with: npx wrangler secret put INGEST_TOKEN) — shared with the GitHub Action
